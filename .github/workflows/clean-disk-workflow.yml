name: Validate Image List

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-images:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate images.txt
      shell: bash
      run: |
        set -euo pipefail

        if [[ ! -f images.txt ]]; then
          echo "images.txt not found"
          exit 1
        fi

        if [[ ! -s images.txt ]]; then
          echo "images.txt is empty"
          exit 1
        fi

        seen_non_comment="false"
        line_number=0

        while IFS= read -r line || [[ -n "$line" ]]; do
          line_number=$((line_number + 1))
          trimmed="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          if [[ -z "$trimmed" ]] || [[ "$trimmed" =~ ^# ]]; then
            continue
          fi

          seen_non_comment="true"

          if [[ "$trimmed" == --platform=* ]]; then
            image_ref="${trimmed#* }"
          else
            image_ref="$trimmed"
          fi

          if [[ -z "$image_ref" ]] || [[ "$image_ref" == "$trimmed" && "$trimmed" == --platform=* ]]; then
            echo "Invalid image entry at line $line_number: $line"
            exit 1
          fi
        done < images.txt

        if [[ "$seen_non_comment" != "true" ]]; then
          echo "images.txt does not contain any image entries"
          exit 1
        fi

        echo "images.txt validation passed"
